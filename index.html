<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>wewe</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--pan:#0D0F13;--line:#1B1F27;--ai:#12151B;--ink:#EEF3F8;--mute:#7F8A9A;--ac:#3DB8FF;--red:#FF6B6B;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;display:inline-grid;place-items:center}
button:focus-visible{outline:2px solid var(--ac)}textarea:focus,textarea:focus-visible{outline:none}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line)}
.ib{width:44px;height:44px;border-radius:14px;color:var(--mute);transition:background .2s,color .2s,transform .15s}
.ib:active{background:var(--pan);color:var(--ink);transform:scale(.9)}
#hl{height:38px;filter:drop-shadow(0 0 10px #3DB8FF55)}
#msgs{flex:1;min-width:0;overflow-x:hidden;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-direction:column;max-width:88%;min-width:0;width:fit-content;margin-bottom:10px;transition:opacity .25s,transform .25s}
.row.out{opacity:0;transform:scale(.9)}
.row.me{align-self:flex-start;align-items:flex-start}.row.ai{align-self:flex-end;align-items:flex-end}
.b{padding:10px 15px;line-height:1.8;font-size:16px;white-space:pre-wrap;min-width:0;max-width:100%;overflow-wrap:anywhere}
.me .b{background:linear-gradient(135deg,#0F74B0,#0A4B78);border-radius:20px 20px 5px 20px;box-shadow:0 8px 24px -10px #3DB8FF88;transform-origin:top right;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.ai .b{background:var(--ai);border:1px solid var(--line);border-radius:20px 20px 20px 5px;animation:up .35s ease-out}
pre{direction:ltr;text-align:left;background:#000;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;font-size:13px;margin:8px 0;white-space:pre;max-width:100%;contain:inline-size}
code{direction:ltr;unicode-bidi:embed;background:#000;border-radius:6px;padding:1px 6px;font-size:14px}
.cr{display:inline-block;width:8px;height:16px;margin-inline-start:3px;vertical-align:middle;border-radius:2px;background:var(--ac);animation:bl .8s steps(2) infinite}
.acts{display:flex;gap:0;margin-top:3px;opacity:.9;animation:fade .4s}
.acts button{width:34px;height:34px;border-radius:10px;color:var(--mute);transition:background .2s,color .2s,transform .15s}
.acts button:active{background:var(--pan);color:var(--ink);transform:scale(.85)}
.acts button.dl:active{color:var(--red)}.acts button.ok{color:var(--ac)}
.dots{display:inline-flex;gap:5px;padding:6px 2px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--ac);animation:bn 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
#hero{margin:auto;text-align:center;padding:10px 6px;position:relative;width:100%;max-width:440px}
#hero::before{content:"";position:absolute;left:50%;top:-30px;width:420px;height:300px;transform:translateX(-50%);background:radial-gradient(closest-side,#3DB8FF2A,transparent);animation:gl 4s ease-in-out infinite;pointer-events:none}
#hero img{position:relative;width:230px;max-width:70%;animation:fl 5s ease-in-out infinite,fade 1s}
#hero h3{position:relative;margin:2px 0 22px;font-size:19px;font-weight:600;color:#C9D6E4}
.chips{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips button{display:flex;align-items:center;gap:10px;background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:13px;font-size:14px;text-align:right;line-height:1.4;animation:up .6s both;transition:border-color .2s,transform .15s}
.chips button:nth-child(1){animation-delay:.3s}.chips button:nth-child(2){animation-delay:.4s}.chips button:nth-child(3){animation-delay:.5s}.chips button:nth-child(4){animation-delay:.6s}
.chips button:active{border-color:var(--ac);transform:scale(.96)}.chips svg{color:var(--ac);flex:none}
#eb{display:flex;align-items:center;justify-content:space-between;margin:0 14px;padding:6px 14px;background:var(--pan);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;font-size:13px;color:var(--mute);animation:up .25s}
#eb button{width:28px;height:28px;border-radius:8px}
#bar{display:flex;align-items:flex-end;gap:4px;margin:8px 12px 12px;padding:6px;background:var(--pan);border:1px solid var(--line);border-radius:28px;transition:border-color .2s,box-shadow .2s}

textarea{flex:1;resize:none;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;padding:10px 8px;max-height:130px;outline-offset:0}
textarea::placeholder{color:var(--mute)}
#mic{width:42px;height:42px;border-radius:50%;color:var(--mute);position:relative;transition:color .2s,background .2s}
#mic.on{color:#fff;background:var(--red)}#mic.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--red);animation:rp 1.2s infinite}
#go{width:42px;height:42px;border-radius:50%;background:var(--ac);color:#00243a;flex:none;overflow:hidden;transition:transform .15s,opacity .2s,background .2s}
#go:active{transform:scale(.88)}#go:disabled{opacity:.3}#go.fly svg{animation:fy .32s ease-in}#go svg{animation:rise .3s}
#dr{position:fixed;inset:0;z-index:5;background:#000b;display:flex;animation:fade .2s;backdrop-filter:blur(3px)}
#side{width:82%;max-width:330px;background:var(--pan);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:8px;animation:sl .3s cubic-bezier(.2,.9,.3,1)}
#side img{height:44px;align-self:flex-start;margin-bottom:6px}
.sb{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--line);text-align:right;justify-content:flex-start;width:100%;transition:background .2s}
.sb:active{background:var(--ai)}.sb.rd{color:var(--red)}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;border-radius:12px;transition:background .2s}.it.on{background:var(--ai)}
.it button:first-child{flex:1;display:flex;align-items:center;gap:10px;justify-content:flex-start;padding:11px;min-width:0;color:var(--ink)}
.it button:first-child span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it button:last-child{color:var(--mute);width:38px;height:38px;border-radius:10px}.it button:last-child:active{color:var(--red)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#16222D;border:1px solid #2B4358;color:var(--ink);padding:10px 16px;border-radius:14px;font-size:14px;z-index:9;width:max-content;max-width:88%;text-align:center;animation:up .3s}
@keyframes pop{from{opacity:0;transform:translate(24px,30px) scale(.5)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes bn{50%{transform:translateY(-7px);opacity:.35}}
@keyframes bl{50%{opacity:0}}
@keyframes rp{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
@keyframes fy{to{transform:translateY(-34px);opacity:0}}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes gl{50%{opacity:.55;transform:translateX(-50%) scale(1.12)}}
@keyframes sl{from{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><button class="ib" id="menu" aria-label="القائمة" data-i="menu" data-s="22"></button><img id="hl" alt="wewe"><button class="ib" id="new" aria-label="محادثة جديدة" data-i="edit" data-s="22"></button></header>
<div id="msgs"></div>
<div id="eb" hidden><span>تعديل الرسالة</span><button id="ec" aria-label="إلغاء التعديل" data-i="x" data-s="16"></button></div>
<div id="bar"><button id="mic" hidden aria-label="إدخال صوتي" data-i="mic" data-s="22"></button><textarea id="ta" rows="1" placeholder="اسأل أي شي..."></textarea><button id="go" aria-label="إرسال"></button></div>
<div id="dr" hidden><div id="side"><img id="sl" alt="wewe"><button class="sb" id="nw"><span data-i="plus" data-s="20"></span>محادثة جديدة</button><div id="list"></div><button class="sb" id="key" hidden><span data-i="key" data-s="20"></span>مفتاح الذكاء</button><button class="sb rd" id="clr"><span data-i="trash" data-s="20"></span>مسح كل المحادثات</button></div></div>

function sv(){try{localStorage.setItem('wewe_chats',JSON.stringify(chats))}catch(e){}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(s){return esc(s).replace(/```(?:\w*\n)?([\s\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')}
const sc=()=>{M.scrollTop=M.scrollHeight};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function grow(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,130)+'px';upGo()}
function upGo(){go.disabled=!busy&&!ta.value.trim()}
function setBusy(v){busy=v;go.innerHTML=ic(v?'stop':'up',22);upGo()}
function row(c,html){const r=document.createElement('div');r.className='row '+c;const b=document.createElement('div');b.className='b';b.innerHTML=html;r.appendChild(b);M.appendChild(r);sc();return{r,b}}
function btn(icon,label,fn,cls){const b=document.createElement('button');b.innerHTML=ic(icon,17);b.title=label;b.setAttribute('aria-label',label);if(cls)b.className=cls;b.onclick=fn;return b}
function render(){M.innerHTML='';
 if(!cur||!cur.msgs.length){M.innerHTML='<div id="hero"><img src="'+LOGO+'" alt="wewe"><h3>كيف أقدر أساعدك اليوم؟</h3><div class="chips">'+SUG.map(s=>'<button>'+ic(s[0],22)+'<span>'+s[1]+'</span></button>').join('')+'</div></div>';
  M.querySelectorAll('.chips button').forEach((b,i)=>b.onclick=()=>send(SUG[i][1]));return}
 cur.msgs.forEach((m,i)=>{const u=m.r==='user';const x=row(u?'me':'ai',u?esc(m.c):md(m.c));x.r.style.animation='none';if(!(popNew&&u&&i===cur.msgs.length-1))x.b.style.animation='none';
  const a=document.createElement('div');a.className='acts';
  a.appendChild(btn('copy','نسخ',e=>{try{navigator.clipboard.writeText(m.c)}catch(_){}const t=e.currentTarget;t.innerHTML=ic('check',17);t.classList.add('ok');setTimeout(()=>{t.innerHTML=ic('copy',17);t.classList.remove('ok')},1500)}));
  if(u)a.appendChild(btn('pen','تعديل',()=>{if(busy)return;editIdx=i;ta.value=m.c;$('#eb').hidden=false;grow();ta.focus()}));
  else if(i===cur.msgs.length-1)a.appendChild(btn('redo','إعادة توليد',()=>{if(busy)return;cur.msgs.pop();sv();render();ask()}));
  a.appendChild(btn('trash','حذف',()=>{if(busy)return;x.r.classList.add('out');setTimeout(()=>{cur.msgs.splice(i,1);sv();render()},250)},'dl'));
  x.r.appendChild(a)});sc()}
function list(){const L=$('#list');L.innerHTML='';chats.forEach(c=>{const d=document.createElement('div');d.className='it'+(c===cur?' on':'');
 d.innerHTML='<button>'+ic('chat',18)+'<span></span></button><button aria-label="حذف المحادثة">'+ic('trash',17)+'</button>';d.querySelector('span').textContent=c.title;
 d.children[0].onclick=()=>{cur=c;render();$('#dr').hidden=true};
 d.children[1].onclick=()=>{chats=chats.filter(z=>z!==c);if(cur===c)cur=null;sv();list();render()};L.appendChild(d)})}
function reveal(b,t){return new Promise(res=>{let i=0;(function st(){if(ctl.signal.aborted)return res();i=Math.min(t.length,i+3);part=t.slice(0,i);b.innerHTML=md(part)+(i<t.length?CARET:'');sc();i<t.length?setTimeout(st,14):res()})()})}
async function gem(){for(let a=0;;a++){try{return await gem1()}catch(e){const m=String(e&&e.message||'');if(a<3&&/high demand|overloaded|unavailable|try again|429|503/i.test(m)){await sleep(2500*(a+1));if(ctl.signal.aborted)throw e;continue}if(/high demand/i.test(m))throw new Error('الخدمة مزدحمة الحين، جرّب بعد دقيقة.');throw e}}}
async function gem1(){let k='';try{k=localStorage.getItem('wewe_k')||''}catch(e){}
 if(!k)throw new Error('أضف مفتاح الذكاء من القائمة أول.');
 if(k.startsWith('gsk_')){const r=await Promise.race([fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:'openai/gpt-oss-120b',messages:[{role:'system',content:SYS}].concat(cur.msgs.map(m=>({role:m.r==='user'?'user':'assistant',content:m.c})))}),signal:ctl.signal}),new Promise((_,j)=>setTimeout(()=>j(new Error('تأخر الرد كثير. تأكد من النت.')),40000))]);const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||'خطأ بالاتصال');return j.choices[0].message.content||''}
 const body={systemInstruction:{parts:[{text:SYS}]},contents:cur.msgs.map(m=>({role:m.r==='user'?'user':'model',parts:[{text:m.c}]}))};
 const r=await Promise.race([fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal}),new Promise((_,j)=>setTimeout(()=>j(new Error('تأخر الرد كثير. تأكد من النت أو جرّب بدون VPN.')),40000))]);
 const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||'خطأ بالاتصال');
 return j.candidates[0].content.parts.map(p=>p.text||'').join('')}
async function ask(d=0){busy=true;part='';ctl=new AbortController();upGo();await sleep(d);setBusy(true);
 let x=null;
 try{
  if(ctl.signal.aborted)throw 0;
  x=row('ai','<span class="dots"><i></i><i></i><i></i></span>');
  if(sample){const p=SYS+'\n\n'+cur.msgs.map(m=>(m.r==='user'?'المستخدم: ':'wewe: ')+m.c).join('\n')+'\nwewe:';
   const r=await sample(p,{cache:false,signal:ctl.signal,onText:t=>{part=t.text;x.b.innerHTML=md(part)+CARET;sc()}});part=r.text}
  else{const t=await gem();await reveal(x.b,t);part=t}
 }catch(e){if(e&&!ctl.signal.aborted&&x)x.b.textContent='صار خطأ: '+(e.message||'جرب مرة ثانية')}
 const ab=ctl.signal.aborted;if(part)cur.msgs.push({r:'assistant',c:part});sv();setBusy(false);if(part||ab){const d=M.scrollHeight-M.scrollTop;render();M.scrollTop=M.scrollHeight-d}}
function send(q){q=(q||ta.value).trim();if(!q||busy)return;
 if(!cur){cur={id:Date.now(),title:q.slice(0,30),msgs:[]};chats.unshift(cur)}
 if(editIdx!==null){cur.msgs=cur.msgs.slice(0,editIdx);editIdx=null;$('#eb').hidden=true}
 cur.msgs.push({r:'user',c:q});ta.value='';grow();sv();popNew=true;render();popNew=false;
 const u=M.querySelector('.row.me:last-of-type');
 go.classList.add('fly');setTimeout(()=>go.classList.remove('fly'),400);ask(330)}
go.onclick=()=>busy?ctl&&ctl.abort():send();
ta.oninput=grow;
ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>700){e.preventDefault();send()}};
$('#ec').onclick=()=>{editIdx=null;ta.value='';$('#eb').hidden=true;grow()};
const nw=()=>{if(busy&&ctl)ctl.abort();cur=null;editIdx=null;$('#eb').hidden=true;render();$('#dr').hidden=true};
$('#new').onclick=nw;$('#nw').onclick=nw;
$('#menu').onclick=()=>{list();$('#dr').hidden=false};
$('#dr').onclick=e=>{if(e.target.id==='dr')$('#dr').hidden=true};
$('#clr').onclick=()=>{if(confirm('تمسح كل المحادثات؟')){chats=[];cur=null;sv();render();list()}};
$('#key').onclick=()=>{const k=prompt('الصق مفتاح الذكاء هنا (Gemini أو Groq)');if(k){try{localStorage.setItem('wewe_k',k.trim())}catch(e){}}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function toast(t){const o=$('#toast');if(o)o.remove();const d=document.createElement('div');d.id='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}
let rec=null;
if(SR){$('#mic').hidden=false;$('#mic').onclick=async()=>{const m=$('#mic');
 if(rec){rec.stop();return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('المايك غير متاح بهذي المعاينة، ويشتغل بعد تحويله لتطبيق.');return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop())}
 catch(e){toast('اسمح لـ wewe باستخدام المايك من إعدادات الجهاز ثم جرّب مرة ثانية.');return}
 const r=new SR();rec=r;r.lang='ar-SA';
 r.onresult=e=>{ta.value+=(ta.value?' ':'')+e.results[0][0].transcript;grow()};
 r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('المايك غير مسموح. فعّله من إعدادات الجهاز.')};
 r.onend=()=>{rec=null;m.classList.remove('on')};
 m.classList.add('on');try{r.start()}catch(e){rec=null;m.classList.remove('on')}}}
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i,+e.dataset.s||20));
$('#hl').src=LOGO;$('#sl').src=LOGO;
{const l=document.createElement('link');l.rel='icon';l.href=LOGO;document.head.appendChild(l)}
(async()=>{try{sample=window.claude?await claude.use('sample'):null}catch(e){sample=null}if(!sample)$('#key').hidden=false})();
setBusy(false);render();
</script>
</body>
</html>
